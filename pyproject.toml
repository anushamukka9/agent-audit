[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-audit"
version = "0.1.0"
description = "Tamper-evident audit logging for AI agent runs: an append-only, hash-chained event log with verification, querying, and export."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Anusha Mukka" }]
keywords = ["audit", "logging", "agents", "ai-safety", "tamper-evident", "hash-chain"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Logging",
]

[project.optional-dependencies]
test = ["pytest>=8"]
lint = ["ruff>=0.4"]

[project.scripts]
agent-audit = "agent_audit.cli:main"

[project.urls]
Homepage = "https://github.com/anushamukka9/agent-audit"
Issues = "https://github.com/anushamukka9/agent-audit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_audit"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
